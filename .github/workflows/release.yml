name: Release

# Pushing a tag starting with v (e.g. v0.1.0) builds a ready-to-run bundle and attaches it to a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag ($GITHUB_REF_NAME) does not match Cargo.toml version (v$version)" >&2
            exit 1
          fi
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libx265-dev libde265-dev libnuma-dev
      # The Rust version is set by rust-toolchain.toml.
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - run: scripts/package.sh target/release dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          A ready-to-run bundle for 64-bit Linux (Ubuntu 24.04 or newer, or a distribution of similar age).

          ```
          tar xf amsil-*-linux-x86_64.tar.gz
          cd amsil-*-linux-x86_64
          ./fetch-models.sh     # download the AI models (once, about 420MB)
          ./amsil
          ```

          See the [README](https://github.com/desafin/amsil#readme) for what the program does, how to use it, and where the AI models come from.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.tar.gz.sha256 \
            --title "Amsil $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
