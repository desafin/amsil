name: Release

# v0.1.0처럼 v로 시작하는 태그를 올리면, 받아서 바로 쓸 수 있는 묶음을 만들어 릴리스에 올린다.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 태그와 Cargo.toml의 버전이 같은지 확인
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "태그($GITHUB_REF_NAME)와 Cargo.toml의 버전(v$version)이 다릅니다" >&2
            exit 1
          fi
      - name: 시스템 패키지
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libx265-dev libde265-dev libnuma-dev
      # Rust 버전은 rust-toolchain.toml이 정한다.
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - run: scripts/package.sh target/release dist
      - name: 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          받아서 바로 쓸 수 있는 묶음입니다 (64비트 Linux, Ubuntu 24.04 이상이나 그와 비슷한 시기의 배포판).

          ```
          tar xf amsil-*-linux-x86_64.tar.gz
          cd amsil-*-linux-x86_64
          ./fetch-models.sh     # AI 모델 받기 (한 번만, 약 420MB)
          ./amsil
          ```

          무엇을 하는 프로그램인지, 어떻게 쓰는지, AI 모델의 출처는 [README](https://github.com/desafin/amsil#readme)에 있습니다.

          A ready-to-run bundle for 64-bit Linux (Ubuntu 24.04 or newer, or a distribution of similar age). Unpack it, run `./fetch-models.sh` once to download the AI models, then start `./amsil`.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.tar.gz.sha256 \
            --title "암실 $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
