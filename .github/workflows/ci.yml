name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 시스템 패키지
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libx265-dev libde265-dev libnuma-dev
      # Rust 버전은 rust-toolchain.toml이 정한다.
      - run: cargo build --locked
      - run: cargo test --locked
